openapi: 3.1.0
info:
  title: Mojie local author API
  version: 0.1.0
  description: Single-author MVP API. SSE payload details are in HTTP_SSE_contract_v0.1.md.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: health
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '503': { $ref: '#/components/responses/Data' }
  /system/capabilities:
    get:
      operationId: capabilities
      description: Includes agentConfigured and the server's selected modelId, allowing clients to verify the expected model before submitting a run.
      responses:
        '200': { $ref: '#/components/responses/Data' }
  /projects:
    get:
      operationId: listProjects
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/Page' }
        '400': { $ref: '#/components/responses/Error' }
    post:
      operationId: createProject
      requestBody: { $ref: '#/components/requestBodies/Title' }
      responses:
        '201': { $ref: '#/components/responses/Data' }
        '400': { $ref: '#/components/responses/Error' }
  /projects/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      operationId: getProject
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: renameProject
      requestBody: { $ref: '#/components/requestBodies/Title' }
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '400': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteProject
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Error' }
  /projects/{id}/chapters:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      operationId: listChapters
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/Page' }
        '400': { $ref: '#/components/responses/Error' }
    post:
      operationId: createChapter
      requestBody: { $ref: '#/components/requestBodies/Title' }
      responses:
        '201': { $ref: '#/components/responses/Data' }
        '409': { $ref: '#/components/responses/Error' }
  /chapters/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      operationId: getChapter
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: renameChapter
      requestBody: { $ref: '#/components/requestBodies/Title' }
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteChapter
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Error' }
  /chapters/{id}/content:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    put:
      operationId: saveChapter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveChapter' }
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '409': { $ref: '#/components/responses/Error' }
  /chapters/{id}/revisions:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      operationId: listRevisions
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/Page' }
  /chapters/{id}/revisions/{version}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getRevision
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '404': { $ref: '#/components/responses/Error' }
  /projects/{id}/settings:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      operationId: listSettings
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [CHARACTER, WORLD, RULE] } }
        - { name: keyword, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/Page' }
        '400': { $ref: '#/components/responses/Error' }
    post:
      operationId: createSetting
      requestBody: { $ref: '#/components/requestBodies/Setting' }
      responses:
        '201': { $ref: '#/components/responses/Data' }
        '409': { $ref: '#/components/responses/Error' }
  /settings/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    patch:
      operationId: updateSetting
      requestBody: { $ref: '#/components/requestBodies/Setting' }
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteSetting
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Error' }
  /agent/runs:
    get:
      operationId: listRuns
      parameters:
        - { name: projectId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: chapterId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/Page' }
        '400': { $ref: '#/components/responses/Error' }
    post:
      operationId: submitRun
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitRun' }
      responses:
        '202': { $ref: '#/components/responses/Data' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /agent/runs/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      operationId: getRun
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '404': { $ref: '#/components/responses/Error' }
  /agent/runs/{id}/cancel:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      operationId: cancelRun
      responses:
        '200': { $ref: '#/components/responses/Data' }
  /agent/runs/{id}/events:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      operationId: streamRunEvents
      description: At most 20 active subscriptions globally; excess connections receive STREAM_CAPACITY_EXCEEDED.
      parameters:
        - { name: afterSeq, in: query, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: Last-Event-ID, in: header, schema: { type: string, pattern: '^[0-9]+$' } }
      responses:
        '200':
          description: Committed events with seq greater than the supplied cursor.
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /agent/runs/{id}/trace:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      operationId: getDevelopmentTrace
      description: Available only when MOJIE_DEV_TRACE=true. Includes the run's persisted modelId and an allowlisted modelConfig (apiPath, maxOutputTokens, contextWindowTokens); no API key or opaque reasoning content.
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '404': { $ref: '#/components/responses/Error' }
  /edit-proposals/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      operationId: getProposal
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '404': { $ref: '#/components/responses/Error' }
  /edit-proposals/{id}/accept:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      operationId: acceptProposal
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '409': { $ref: '#/components/responses/Data' }
  /edit-proposals/{id}/reject:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      operationId: rejectProposal
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '409': { $ref: '#/components/responses/Error' }
  /projects/{id}/conversations:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: createConversation
      responses:
        '201':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    get:
      operationId: listConversations
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - &id001
        $ref: '#/components/parameters/Cursor'
      - &id002
        $ref: '#/components/parameters/Limit'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
  /conversations/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getConversation
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateConversation
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationPatch'
  /conversations/{id}/messages:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listConversationMessages
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters: &id003
      - *id001
      - *id002
    post:
      operationId: sendConversationMessage
      responses:
        '202':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationSend'
  /conversations/{id}/messages/{messageId}/retry:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: messageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: retryConversationMessage
      responses:
        '202':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - clientRequestId
              properties:
                clientRequestId:
                  type: string
                  format: uuid
  /conversations/{id}/skills:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getConversationSkills
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    put:
      operationId: setConversationSkills
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 8
              items:
                $ref: '#/components/schemas/SkillSelection'
  /skills/capabilities:
    get:
      operationId: getSkillCapabilities
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /skills/import:
    post:
      operationId: importSkill
      responses:
        '202':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          multipart/form-data: &id004
            schema:
              type: object
              required:
              - files
              properties:
                files:
                  type: array
                  maxItems: 500
                  items:
                    type: string
                    format: binary
                paths:
                  type: array
                  items:
                    type: string
                  description: One relative path per file for a directory; one Markdown
                    file becomes SKILL.md.
  /skill-uploads/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getSkillUpload
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /skills:
    get:
      operationId: listSkills
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters: *id003
  /skills/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getSkill
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateSkill
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - expectedVersion
              properties:
                expectedVersion:
                  type: integer
                  minimum: 1
                enabled:
                  type: boolean
                currentVersionId:
                  type: string
                  format: uuid
    delete:
      operationId: deleteSkill
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: expectedVersion
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
  /skills/{id}/versions:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listSkillVersions
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters: *id003
    post:
      operationId: publishSkillVersion
      responses:
        '202':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          multipart/form-data: *id004
          application/json:
            schema:
              type: object
              required:
              - baseVersionId
              - files
              properties:
                baseVersionId:
                  type: string
                  format: uuid
                files:
                  type: object
                  additionalProperties:
                    type: string
  /skills/{id}/versions/{versionId}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getSkillVersion
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /skills/{id}/versions/{versionId}/export:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: exportSkillVersion
      responses:
        '200':
          description: Protected download, attachment and nosniff
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /skills/{id}/versions/{versionId}/files/{fileId}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: downloadSkillFile
      responses:
        '200':
          description: Protected download, attachment and nosniff
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /artifacts/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getArtifact
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /artifacts/{id}/download:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: downloadArtifact
      responses:
        '200':
          description: Protected download, attachment and nosniff
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /agent/runs/{id}/resources:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getRunSkillsAndArtifacts
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
  requestBodies:
    Title:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title]
            properties: { title: { type: string } }
    Setting:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [type, title, content]
            properties:
              type: { type: string, enum: [CHARACTER, WORLD, RULE] }
              title: { type: string }
              content: { type: string }
  schemas:
    SkillSelection:
      type: object
      required:
      - skillId
      - versionId
      properties:
        skillId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
    ConversationPatch:
      type: object
      required:
      - expectedVersion
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 100
        status:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
        discoveryEnabled:
          type: boolean
    ConversationSend:
      type: object
      required:
      - content
      - clientRequestId
      - expectedConversationSeq
      - taskType
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 8000
        clientRequestId:
          type: string
          format: uuid
        expectedConversationSeq:
          type: integer
          minimum: 0
        taskType:
          type: string
          enum:
          - CHAT
          - CHAPTER_REVIEW
          - CHAPTER_EDIT
        targetChapterId:
          type: string
          format: uuid
          description: Required only for chapter tasks; forbidden for CHAT.
        expectedVersion:
          type: integer
          minimum: 1
        selectedSkills:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/SkillSelection'
    SaveChapter:
      type: object
      required: [content, expectedVersion]
      properties:
        content: { type: string }
        expectedVersion: { type: integer, minimum: 1 }
    SubmitRun:
      type: object
      required: [projectId, targetChapterId, expectedVersion, instruction, clientRequestId]
      properties:
        projectId: { type: string, format: uuid }
        targetChapterId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 1 }
        instruction: { type: string }
        clientRequestId: { type: string, format: uuid }
    Error:
      type: object
      required: [code, message, requestId, details]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string, format: uuid }
        details: { type: object }
    Page:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { type: object } }
        nextCursor: { type: [string, 'null'] }
  responses:
    Data:
      description: Success envelope.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties: { data: { type: object } }
    Page:
      description: Cursor page.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/Page' }
    Error:
      description: Failure envelope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
