components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
  requestBodies:
    Title:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title]
            properties: { title: { type: string } }
    Setting:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [type, title, content]
            properties:
              type: { type: string, enum: [CHARACTER, WORLD, RULE] }
              title: { type: string }
              content: { type: string }
    SettingSave:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [type, title, content, expectedVersion]
            properties:
              type: { type: string, enum: [CHARACTER, WORLD, RULE] }
              title: { type: string, minLength: 1, maxLength: 80 }
              content: { type: string, minLength: 1, maxLength: 2000 }
              expectedVersion: { type: integer, minimum: 1 }
    SettingProposalSave:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [type, title, content]
            properties:
              type: { type: string, enum: [CHARACTER, WORLD, RULE] }
              title: { type: string, minLength: 1, maxLength: 80 }
              content: { type: string, minLength: 1, maxLength: 2000 }
              expectedVersion:
                type: integer
                minimum: 1
                description: Required for UPDATE; must be omitted for CREATE.
  schemas:
    SkillMention:
      type: object
      required:
      - skillId
      properties:
        skillId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Name shown in the authored reference; identity remains skillId after a rename. Version is resolved by the server.
    ConversationPatch:
      type: object
      required:
      - expectedVersion
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 100
    ConversationSend:
      type: object
      required:
      - content
      - clientRequestId
      - expectedConversationSeq
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 8000
        clientRequestId:
          type: string
          format: uuid
        expectedConversationSeq:
          type: integer
          minimum: 0
        taskType:
          type: string
          default: ASSISTANT
          description: Optional compatibility field. New clients omit this and use one assistant workflow.
          enum:
          - ASSISTANT
          - CHAPTER_REVIEW
          - CHAPTER_EDIT
        targetChapterId:
          type: string
          format: uuid
          description: Legacy chapter-task target; forbidden for ASSISTANT.
        expectedVersion:
          type: integer
          minimum: 1
        contextChapterId:
          type: string
          format: uuid
          description: Optional preferred chapter for ASSISTANT turns; supply together with contextVersion. Not an edit target.
        contextVersion:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Saved reference version fixed at acceptance; body is read only when needed.
        skillMentions:
          description: Explicit references in this message. Dollar references in content are also resolved. Other enabled Skills remain discoverable.
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/SkillMention'
    SaveChapter:
      type: object
      required: [content, expectedVersion]
      properties:
        content: { type: string }
        expectedVersion: { type: integer, minimum: 1 }
    SubmitRun:
      type: object
      required: [projectId, targetChapterId, expectedVersion, instruction, clientRequestId]
      properties:
        projectId: { type: string, format: uuid }
        targetChapterId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 1 }
        instruction: { type: string }
        clientRequestId: { type: string, format: uuid }
    Error:
      type: object
      required: [code, message, requestId, details]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string, format: uuid }
        details: { type: object }
    Page:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { type: object } }
        nextCursor: { type: [string, 'null'] }
  responses:
    Data:
      description: Success envelope.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties: { data: { type: object } }
    Page:
      description: Cursor page.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/Page' }
    Error:
      description: Failure envelope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
