openapi: 3.1.0
info:
  title: Mojie local author API
  version: 0.1.0
  description: Single-author MVP API. SSE payload details are in HTTP_SSE_contract_v0.1.md.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: health
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '503': { $ref: '#/components/responses/Data' }
  /system/capabilities:
    get:
      operationId: capabilities
      description: Includes agentConfigured, modelMetadataAvailable and the server's selected modelId. Missing metadata temporarily blocks new task admission while content editing remains available.
      responses:
        '200': { $ref: '#/components/responses/Data' }
  /projects:
    get:
      operationId: listProjects
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/Page' }
        '400': { $ref: '#/components/responses/Error' }
    post:
      operationId: createProject
      requestBody: { $ref: '#/components/requestBodies/Title' }
      responses:
        '201': { $ref: '#/components/responses/Data' }
        '400': { $ref: '#/components/responses/Error' }
  /projects/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      operationId: getProject
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: renameProject
      requestBody: { $ref: '#/components/requestBodies/Title' }
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '400': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteProject
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Error' }
  /projects/{id}/chapters:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      operationId: listChapters
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/Page' }
        '400': { $ref: '#/components/responses/Error' }
    post:
      operationId: createChapter
      requestBody: { $ref: '#/components/requestBodies/Title' }
      responses:
        '201': { $ref: '#/components/responses/Data' }
        '409': { $ref: '#/components/responses/Error' }
  /chapters/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      operationId: getChapter
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: renameChapter
      requestBody: { $ref: '#/components/requestBodies/Title' }
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteChapter
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Error' }
  /chapters/{id}/content:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    put:
      operationId: saveChapter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveChapter' }
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '409': { $ref: '#/components/responses/Error' }
  /chapters/{id}/revisions:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      operationId: listRevisions
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/Page' }
  /chapters/{id}/revisions/{version}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getRevision
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '404': { $ref: '#/components/responses/Error' }
  /projects/{id}/settings:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      operationId: listSettings
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [CHARACTER, WORLD, RULE] } }
        - { name: keyword, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/Page' }
        '400': { $ref: '#/components/responses/Error' }
    post:
      operationId: createSetting
      requestBody: { $ref: '#/components/requestBodies/Setting' }
      responses:
        '201': { $ref: '#/components/responses/Data' }
        '409': { $ref: '#/components/responses/Error' }
  /settings/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      operationId: getSetting
      description: Saved setting including its version.
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateSetting
      requestBody: { $ref: '#/components/requestBodies/SettingSave' }
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteSetting
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Error' }
  /settings/{id}/revisions:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      operationId: getSettingRevisions
      description: Latest 50 immutable revisions, newest first, including type, title, content, source and proposalId.
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '404': { $ref: '#/components/responses/Error' }
  /agent/runs:
    get:
      operationId: listRuns
      parameters:
        - { name: projectId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: chapterId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/Page' }
        '400': { $ref: '#/components/responses/Error' }
    post:
      operationId: submitRun
      description: Uses an instance-wide clientRequestId. New submissions return MODEL_METADATA_UNAVAILABLE (503) while model context metadata is unavailable; existing idempotent receipts remain readable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitRun' }
      responses:
        '202': { $ref: '#/components/responses/Data' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /agent/runs/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      operationId: getRun
      description: >-
        Includes steps, sources and activities. Activities contain only user-facing text
        from task responses with tool calls, ordered by message sequence; each has a stable
        id, modelCallIndex and text. Final answers remain in analysis and conversation
        messages. Provider reasoning and compaction output are excluded. Available without
        enabling the developer trace endpoint.
        output is the recoverable public draft for the latest TASK model call (or null),
        with modelCallIndex, text, lastEventSeq, status and finishReason. The draft and
        run lastEventSeq are read in one consistent snapshot; subscribe after that cursor
        to receive subsequent increments. Drafts do not imply successful completion.
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '404': { $ref: '#/components/responses/Error' }
  /agent/runs/{id}/cancel:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      operationId: cancelRun
      responses:
        '200': { $ref: '#/components/responses/Data' }
  /agent/runs/{id}/events:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      operationId: streamRunEvents
      description: >-
        At most 20 active subscriptions globally; excess connections receive STREAM_CAPACITY_EXCEEDED.
        model.text.delta events carry payload.callIndex and payload.text (new public text only).
        Use the envelope seq to deduplicate replay. Each model call has a separate draft.
        Provider reasoning, partial tool arguments and history compaction output are excluded.
      parameters:
        - { name: afterSeq, in: query, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: Last-Event-ID, in: header, schema: { type: string, pattern: '^[0-9]+$' } }
      responses:
        '200':
          description: Committed events with seq greater than the supplied cursor.
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /agent/runs/{id}/trace:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      operationId: getDevelopmentTrace
      description: Available only when MOJIE_DEV_TRACE=true. Includes the run's persisted modelId and an allowlisted modelConfig (apiPath, maxOutputTokens, contextWindowTokens, contextWindowSource, contextWindowFetchedAt); no API key or opaque reasoning content.
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '404': { $ref: '#/components/responses/Error' }
  /edit-proposals/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      operationId: getProposal
      description: Includes operation (CREATE/UPDATE), createdChapterId/createdSettingId, and existing UPDATE base metadata. CREATE has baseVersion 0 and empty baseContent.
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '404': { $ref: '#/components/responses/Error' }
  /edit-proposals/{id}/accept:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      operationId: acceptProposal
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '409': { $ref: '#/components/responses/Data' }
  /edit-proposals/{id}/reject:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      operationId: rejectProposal
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '409': { $ref: '#/components/responses/Error' }
  /edit-proposals/{id}/setting:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    put:
      operationId: saveReviewedSettingProposal
      description: Save the reviewed setting draft atomically. CREATE omits expectedVersion and returns targetSettingId, creates complete v1 only on save; UPDATE requires expectedVersion and checks conflicts. Repeated saves return the existing result.
      requestBody: { $ref: '#/components/requestBodies/SettingProposalSave' }
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '409': { $ref: '#/components/responses/Data' }
  /edit-proposals/{id}/chapter:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    put:
      operationId: saveReviewedNewChapterProposal
      description: Save a CREATE chapter draft as complete v1 appended to the work. Returns targetChapterId. Applied proposal retries return the same ID without duplication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
                content: { type: string, minLength: 1, maxLength: 6000 }
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '409': { $ref: '#/components/responses/Error' }
  /projects/{id}/conversations:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: createConversation
      responses:
        '201':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    get:
      operationId: listConversations
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - &id001
        $ref: '#/components/parameters/Cursor'
      - &id002
        $ref: '#/components/parameters/Limit'
  /conversations/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getConversation
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateConversation
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationPatch'
  /conversations/{id}/messages:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listConversationMessages
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters: &id003
      - *id001
      - *id002
    post:
      operationId: sendConversationMessage
      responses:
        '202':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationSend'
  /conversations/{id}/messages/{messageId}/retry:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: messageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: retryConversationMessage
      responses:
        '202':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - clientRequestId
              properties:
                clientRequestId:
                  type: string
                  format: uuid
  /skills/capabilities:
    get:
      operationId: getSkillCapabilities
      description: Context-only Skills. Returns upload limits, mode CONTEXT_ONLY and scriptExecution false; no executor configuration.
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /skills/import:
    post:
      operationId: importSkill
      responses:
        '202':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          multipart/form-data: &id004
            schema:
              type: object
              required:
              - files
              properties:
                files:
                  type: array
                  maxItems: 500
                  items:
                    type: string
                    format: binary
                paths:
                  type: array
                  items:
                    type: string
                  description: One relative path per file for a directory; one Markdown
                    file becomes SKILL.md.
  /skill-uploads/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getSkillUpload
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /skills:
    get:
      operationId: listSkills
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters: *id003
  /skills/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getSkill
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateSkill
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - expectedVersion
              properties:
                expectedVersion:
                  type: integer
                  minimum: 1
                enabled:
                  type: boolean
                currentVersionId:
                  type: string
                  format: uuid
    delete:
      operationId: deleteSkill
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: expectedVersion
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
  /skills/{id}/versions:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listSkillVersions
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters: *id003
    post:
      operationId: publishSkillVersion
      responses:
        '202':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          multipart/form-data: *id004
          application/json:
            schema:
              type: object
              required:
              - baseVersionId
              - files
              properties:
                baseVersionId:
                  type: string
                  format: uuid
                files:
                  type: object
                  additionalProperties:
                    type: string
  /skills/{id}/versions/{versionId}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getSkillVersion
      description: Immutable package with current context-only compatibility (warnings, scripts preserved for export, unsupported tool declarations). Historical runtime capabilities do not grant execution.
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /skills/{id}/versions/{versionId}/export:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: exportSkillVersion
      responses:
        '200':
          description: Protected download, attachment and nosniff
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /skills/{id}/versions/{versionId}/files/{fileId}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: downloadSkillFile
      responses:
        '200':
          description: Protected download, attachment and nosniff
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /artifacts/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getArtifact
      description: Historical artifacts only; Skills no longer generate new artifacts.
      responses:
        '200':
          $ref: '#/components/responses/Data'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /artifacts/{id}/download:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: downloadArtifact
      responses:
        '200':
          description: Protected download, attachment and nosniff
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
