services:
  postgres:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_DB: mojie
      POSTGRES_USER: mojie
      POSTGRES_PASSWORD: ${MOJIE_DB_PASSWORD:-mojie_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mojie_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mojie -d mojie"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  mojie_pgdata:
