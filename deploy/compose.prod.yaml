services:
  postgres:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    restart: always
    environment:
      POSTGRES_DB: mojie
      POSTGRES_USER: mojie
      POSTGRES_PASSWORD: "${MOJIE_DB_PASSWORD:?Set MOJIE_DB_PASSWORD in deploy/.env.prod}"
    volumes:
      - mojie_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mojie -d mojie"]
      interval: 5s
      timeout: 3s
      retries: 20

  files-init:
    image: alpine:3.22
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data/skills /data/artifacts && chown -R 10001:10001 /data"]
    volumes:
      - mojie_files:/data
    restart: "no"

  skill-executor:
    image: "${MOJIE_EXECUTOR_IMAGE:-${MOJIE_IMAGE_PREFIX:-ghcr.io/aster-sunfell/mojie}-executor:${MOJIE_IMAGE_TAG:?Set MOJIE_IMAGE_TAG}}"
    restart: always
    # The trusted coordinator needs the host daemon on SELinux hosts.
    # Uploaded scripts still run in separate containers with their own labels.
    security_opt: ["label=disable"]
    environment:
      MOJIE_EXECUTOR_BIND: 0.0.0.0
      MOJIE_EXECUTOR_WORK_DIR: "${MOJIE_EXECUTOR_WORK_DIR:-/var/lib/mojie-executor}"
      MOJIE_PYTHON_IMAGE: "${MOJIE_PYTHON_IMAGE:-python@sha256:a3ab0b966bc4e91546a033e22093cb840908979487a9fc0e6e38295747e49ac0}"
      MOJIE_NODE_IMAGE: "${MOJIE_NODE_IMAGE:-node@sha256:43ac6c60b8f89723f746e8a92ce91abd5017e627ce1ddfe4238355d3a30b772c}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${MOJIE_EXECUTOR_WORK_DIR:-/var/lib/mojie-executor}:${MOJIE_EXECUTOR_WORK_DIR:-/var/lib/mojie-executor}:z"
    networks: [execution]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 6

  backend:
    image: "${MOJIE_BACKEND_IMAGE:-${MOJIE_IMAGE_PREFIX:-ghcr.io/aster-sunfell/mojie}-backend:${MOJIE_IMAGE_TAG:?Set MOJIE_IMAGE_TAG to a successful CI commit SHA in deploy/.env.prod}}"
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      files-init:
        condition: service_completed_successfully
    volumes:
      - mojie_files:/data
      - "${MOJIE_CONTROL_DIR:-./control}:/run/mojie-control:ro,z"
    networks: [default, execution]
    environment:
      MOJIE_DATA_DIR: /data
      MOJIE_MAINTENANCE_FILE: /run/mojie-control/maintenance
      MOJIE_SKILL_EXECUTOR_URL: http://skill-executor:8091
      MOJIE_DB_URL: jdbc:postgresql://postgres:5432/mojie
      MOJIE_DB_USER: mojie
      MOJIE_DB_PASSWORD: "${MOJIE_DB_PASSWORD:?Set MOJIE_DB_PASSWORD in deploy/.env.prod}"
      MOJIE_BIND_HOST: 0.0.0.0
      MOJIE_CURSOR_KEY: "${MOJIE_CURSOR_KEY:?Set MOJIE_CURSOR_KEY in deploy/.env.prod}"
      MOJIE_MODEL_API_PATH: "${MOJIE_MODEL_API_PATH:-/v1/messages}"
      MOJIE_MODEL_BASE_URL: "${MOJIE_MODEL_BASE_URL:-}"
      MOJIE_MODEL_API_KEY: "${MOJIE_MODEL_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      MOJIE_ANTHROPIC_BASE_URL: "${MOJIE_ANTHROPIC_BASE_URL:-}"
      MOJIE_MODEL_ID: "${MOJIE_MODEL_ID:-}"
      MOJIE_MODEL_CONTEXT_TOKENS: "${MOJIE_MODEL_CONTEXT_TOKENS:-}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/health | grep -Eq '\"status\"[[:space:]]*:[[:space:]]*\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: "${MOJIE_WEB_IMAGE:-${MOJIE_IMAGE_PREFIX:-ghcr.io/aster-sunfell/mojie}-web:${MOJIE_IMAGE_TAG:?Set MOJIE_IMAGE_TAG}}"
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${MOJIE_HTTP_BIND:-127.0.0.1}:${MOJIE_HTTP_PORT:-8088}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mojie_pgdata:
  mojie_files:

networks:
  execution:
    internal: true
