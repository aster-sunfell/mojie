spring:
  datasource:
    url: "${MOJIE_DB_URL:jdbc:postgresql://localhost:5432/mojie}"
    username: "${MOJIE_DB_USER:mojie}"
    password: "${MOJIE_DB_PASSWORD:mojie_dev_only}"
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: "${MOJIE_DB_CONNECTION_TIMEOUT_MS:5000}"
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  flyway:
    enabled: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: "${MOJIE_PORT:8080}"
  address: "${MOJIE_BIND_HOST:127.0.0.1}"

mojie:
  model:
    api-path: "${MOJIE_MODEL_API_PATH:/v1/messages}"
    base-url: "${MOJIE_MODEL_BASE_URL:}"
    api-key: "${MOJIE_MODEL_API_KEY:}"
    id: "${MOJIE_MODEL_ID:}"
    anthropic-api-key: "${ANTHROPIC_API_KEY:}"
    anthropic-base-url: "${MOJIE_ANTHROPIC_BASE_URL:}"
    # Optional override for custom providers; known providers resolve their window online.
    context-tokens: "${MOJIE_MODEL_CONTEXT_TOKENS:}"
    streaming:
      first-event-timeout: "${MOJIE_MODEL_FIRST_EVENT_TIMEOUT:180s}"
      idle-timeout: "${MOJIE_MODEL_STREAM_IDLE_TIMEOUT:60s}"
    metadata:
      catalog-url: "https://models.dev/api.json"
      request-timeout: 5s
      refresh-interval: 24h
      max-cache-age: 7d
