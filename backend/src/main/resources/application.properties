spring.datasource.url=${MOJIE_DB_URL:jdbc:postgresql://localhost:5432/mojie}
spring.datasource.username=${MOJIE_DB_USER:mojie}
spring.datasource.password=${MOJIE_DB_PASSWORD:mojie_dev_only}
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=2
spring.flyway.enabled=false
spring.jackson.serialization.write-dates-as-timestamps=false
server.port=${MOJIE_PORT:8080}
server.address=${MOJIE_BIND_HOST:127.0.0.1}
